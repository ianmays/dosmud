name: CI Metrics History

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-history:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CI stats artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-artifact"
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name ci-stats \
            --dir "$RUNNER_TEMP/ci-artifact"
          test -f "$RUNNER_TEMP/ci-artifact/ci-stats.json"

      - name: Prepare metrics branch worktree
        run: |
          git fetch origin ci-metrics || true
          if git show-ref --verify --quiet refs/remotes/origin/ci-metrics; then
            git worktree add --detach "$RUNNER_TEMP/ci-metrics" origin/ci-metrics
            cd "$RUNNER_TEMP/ci-metrics"
            git checkout -B ci-metrics origin/ci-metrics
          else
            git worktree add --detach "$RUNNER_TEMP/ci-metrics" HEAD
            cd "$RUNNER_TEMP/ci-metrics"
            git checkout --orphan ci-metrics
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cd "$RUNNER_TEMP/ci-metrics"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name history.json -exec rm -rf {} +

      - name: Append metrics history
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/append-ci-history.py" \
            --input "$RUNNER_TEMP/ci-artifact/ci-stats.json" \
            --output "$RUNNER_TEMP/ci-metrics/history.json"

      - name: Commit and push metrics history
        run: |
          cd "$RUNNER_TEMP/ci-metrics"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No metrics history update needed."
            exit 0
          fi
          git commit -m "update ci metrics history"
          git push origin ci-metrics
