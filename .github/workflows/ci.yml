name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Check test gaps (diff vs base, informative)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TEST_GAP_INFORMATIVE: "1"
        run: sh scripts/check-test-gaps.sh "origin/${{ github.base_ref }}"

      - name: Run CI stats and write report
        id: ci_report
        run: sh scripts/ci-stats.sh
        continue-on-error: true

      - name: Find existing CI results comment
        if: github.event_name == 'pull_request'
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- ci-test-results -->"

      - name: Post test results on pull request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ci-test-report.md
          edit-mode: replace

      - name: Upload CI stats artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-stats
          path: ci-stats.json

      - name: Fail if tests failed
        if: steps.ci_report.outcome == 'failure'
        run: exit 1
