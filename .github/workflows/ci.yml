name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run tests and write report
        id: ci_report
        run: sh scripts/ci-test-report.sh
        continue-on-error: true

      - name: Post test results on pull request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ci-test-report.md
          comment-tag: ci-test-results

      - name: Fail if tests failed
        if: steps.ci_report.outcome == 'failure'
        run: exit 1
